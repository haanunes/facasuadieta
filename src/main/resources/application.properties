spring.application.name=facasuadieta

# Porta do Servidor Web
server.port=8080

# --- CONFIGURACAO DO BANCO DE DADOS (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/facasuadieta?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CONFIGURACOES DO JPA / HIBERNATE ---
# update: cria as tabelas automaticamente e atualiza o schema sem apagar dados existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACAO DE TIMEOUT PARA PROCESSOS LONGOS (Ex: Scraping da TBCA) ---
spring.mvc.async.request-timeout=300000